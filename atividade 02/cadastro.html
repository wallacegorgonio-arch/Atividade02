    <main>
        <div class="d-flex justify-content-center align-items-center min-vh-100 w-100 ">

        <div class="w-25">
            <h1 class="h3 text-center">CADASTRO:</h1>

            <form action="">
                <div class="mb-3">
                    <label class="form-label" for="username">nome do usuario</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input class="form-control" type="text" name="username" id="username">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">e-mail</label>
                    <div class="input-group">
                        <input class="form-control" type="email" name="email" id="email">
                        <span class="input-group-text">@exemplo.com</span>
                    </div>
                    <div class="mb-3 ">
                        <label class="form-label" for="sex">Genero</label>
                         <select class="form-select" name="sex" id="sex">
                         <option value="selecione um item" selected>selecione um item</option>
                        <option value="homem cis">homem cis</option>
                        <option value="mulher cis">mulher cis</option>
                        <option value="homem trans">homem trans</option>
                        <option value="mulher trans">mulher trans</option>
                        <option value="outros">outros</option>
                    </select>
                    </div>
                    <label class="form-label">escolha sua profissão</label>
                    <div class="mb-3">
                        
                        <div class="form-check form-check-inline">
                            <input class="form-input-check" type="radio" name="job" id="job1">
                            <label class="form-label" for="job1">estudante</label>

                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-input-check" type="radio" name="job" id="job2">
                            <label class="form-label" for="job2">engenheiro</label>

                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-input-check" type="radio" name="job" id="job3">
                            <label class="form-label" for="job3">arquiteto</label>

                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-input-check" type="radio" name="job" id="job4">
                            <label class="form-label" for="job4">professor</label>

                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-input-check" type="radio" name="job" id="job5">
                            <label class="form-label" for="job5">desenvolvedor de software</label>

                        </div>

                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="senha">senha</label>
                    <input class="form-control" type="password" name="senha" id="senha">
                    <div class="form-text">A senha deve possuir no minimo 8 caractere</div>
                    <div class="form-text">A senha deve conter letras maiusculas e minusculas</div>
                </div>
                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="checkbox" id="checkbox">
                    <label class="form-label" for="checkbox">lembrar de mim:</label>
                </div>
                <button class="btn btn-primary  w-100">entrar</button>
            </form>
        </div>
    </div>
